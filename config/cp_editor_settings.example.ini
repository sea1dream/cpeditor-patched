[General]
default_language=C++
locale=\x7b80\x4f53\x4e2d\x6587
replace_tabs=true
tab_width=4
editor_font=@Variant(\0\0\0@\0\0\0\x1c\0J\0\x65\0t\0\x42\0r\0\x61\0i\0n\0s\0 \0M\0o\0n\0o@%\0\0\0\0\0\0\xff\xff\xff\xff\x2\x1\0?\x11)
test_cases_font=@Variant(\0\0\0@\0\0\0\x1c\0J\0\x65\0t\0\x42\0r\0\x61\0i\0n\0s\0 \0M\0o\0n\0o@%\0\0\0\0\0\0\xff\xff\xff\xff\x2\x1\0?\x11)
message_logger_font=@Variant(\0\0\0@\0\0\0\x1c\0J\0\x65\0t\0\x42\0r\0\x61\0i\0n\0s\0 \0M\0o\0n\0o@%\0\0\0\0\0\0\xff\xff\xff\xff\x2\x1\0?\x11)
editor_theme=Dracula
ui_style=Dark Fusion
format_on_manual_save=true
format_on_auto_save=false
auto_complete_parentheses=true
auto_remove_parentheses=true
auto_indent=true
auto_save=true
auto_save_interval=1000
auto_save_interval_type=After the last modification
wrap_text=false
run_on_empty_testcase=true
save_file_on_compilation=true
save_file_on_execution=false
save_tests=true
input_file_save_path=./testcases/${basename}_${1-index}.in
answer_file_save_path=./testcases/${basename}_${1-index}.ans
default_time_limit=5000

[clang_format]
program=C:/Program Files/LLVM/bin/clang-format.exe
style=Language: Cpp\nBasedOnStyle: Google\nUseTab: Never\nIndentWidth: 4\nTabWidth: 4\nColumnLimit: 80
arguments=

[competitive_companion]
connection_port=10045
enable=true
head_comments_powered_by_cp_editor=false
open_new_tab=true
set_time_limit_for_tab=true

[hot_exit]
auto_save=true
auto_save_interval=10000
enable=true

[cpp]
compile_command="D:/msys64/ucrt64/bin/g++.exe -std=gnu++20 -DLOCAL"
compiler_output_codec=UTF-8
output_path=${tmpdir}/${basename}
template_path=D:/CP Editor/config/templates/luogu-template.cpp
template_cursor_position_regex=void solve\\(\\) \\{
template_cursor_position_offset_type=end
template_cursor_position_offset_characters=0

[lsp]
args_cpp="--query-driver=D:/msys64/ucrt64/bin/g++.exe --compile-commands-dir=\"D:/CP Editor/clangd\""
path_cpp=C:/Program Files/LLVM/bin/clangd.exe
use_autocomplete_cpp=true
use_linting_cpp=true
delay_cpp=1000
use_autocomplete_java=false
use_autocomplete_python=false
use_linting_java=false
use_linting_python=false

[hotkey]
format=Shift+Alt+F
compile_run=Ctrl+Alt+N

[proxy]
enabled=false
type=System
host_name=
port=0
user=
password=

[wakatime]
path=wakatime
api_key=
enable=false
proxy=false
